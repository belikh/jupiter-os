# vulnix whitelist (https://github.com/nix-community/vulnix#whitelisting).
# Each rule holds only while the detected CVEs are a subset of its cve list
# and until its review date. Rules below cover name collisions: Haskell, Rust
# and npm packages (or NixOS config derivations) whose name equals an
# unrelated product, so NVD attaches that product's CVEs to them.

