# Run an arbitrary root command on callisto via the europa hop.
# Dispatch with inputs.cmd. Base64-smuggled to survive nested-ssh quoting.
name: Callisto command

on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Shell command to run on callisto as root'
        required: true
      timeout:
        description: 'Command timeout (seconds)'
        required: false
        default: '120'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Join tailnet
        run: |
          TS_OK=0
          for _ in $(seq 1 30); do
            if curl -fsSL -o /tmp/ts-install.sh https://tailscale.com/install.sh \
               && sudo sh /tmp/ts-install.sh \
               && command -v tailscale >/dev/null; then
              TS_OK=1; break
            fi
            sleep 10
          done
          [ "$TS_OK" = 1 ] || { echo "::error::tailscale install never succeeded"; exit 1; }
          sudo tailscale up \
            --login-server=https://neptune.jupiter.au:8080 \
            --authkey=${{ secrets.TAILSCALE_CI_AUTHKEY }} \
            --hostname="ci-cmd-${{ github.run_id }}" \
            --accept-routes

      - name: Stage root@europa identity
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EUROPA_SSH_KEY }}" > "$HOME/.ssh/europa_ci"
          chmod 600 "$HOME/.ssh/europa_ci"
          {
            echo "Host europa"
            echo "  HostName europa"
            echo "  User root"
            echo "  IdentityFile $HOME/.ssh/europa_ci"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ServerAliveInterval 30"
          } >> "$HOME/.ssh/config"

      - name: Run command on callisto
        run: |
          tailscale ip -4 || { echo "::error::never registered on tailnet"; exit 1; }
          # Single-quote the input: it is base64 (alnum only, no quotes) when pre-encoded by the
        # caller; printf '%s' "..." would $-expand plain-text payloads on the runner and
        # mangle them before they ever reach callisto.
        PAYLOAD=$(printf '%s' '${{ inputs.cmd }}' | base64 -w0)
          ssh root@europa \
            "ssh -i /run/secrets/nix_build_ssh_key root@10.1.1.3 'echo $PAYLOAD | base64 -d | timeout ${{ inputs.timeout }} bash'; echo EXIT=\$?"
