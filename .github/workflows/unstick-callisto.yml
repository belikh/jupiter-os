# Unstick callisto: kill wedged root nixos-rebuild processes after a deploy
# cap-cancel, then re-dispatch deploy. Dispatch-only; no push trigger.
name: Unstick — callisto

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unstick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Join tailnet
        run: |
          TS_OK=0
          for _ in $(seq 1 30); do
            if curl -fsSL -o /tmp/ts-install.sh https://tailscale.com/install.sh \
               && sudo sh /tmp/ts-install.sh \
               && command -v tailscale >/dev/null; then
              TS_OK=1; break
            fi
            sleep 10
          done
          [ "$TS_OK" = 1 ] || { echo "::error::tailscale install never succeeded"; exit 1; }
          sudo tailscale up \
            --login-server=https://neptune.jupiter.au:8080 \
            --authkey=${{ secrets.TAILSCALE_CI_AUTHKEY }} \
            --hostname="ci-unstick-${{ github.run_id }}" \
            --accept-routes

      - name: Stage root@europa identity
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.EUROPA_SSH_KEY }}" > "$HOME/.ssh/europa_ci"
          chmod 600 "$HOME/.ssh/europa_ci"
          {
            echo "Host europa"
            echo "  HostName europa"
            echo "  User root"
            echo "  IdentityFile $HOME/.ssh/europa_ci"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ServerAliveInterval 30"
          } >> "$HOME/.ssh/config"

      - name: Kill wedged rebuilds on callisto (via europa hop)
        run: |
          tailscale ip -4 || { echo "::error::never registered on tailnet"; exit 1; }
          ssh root@europa \
            "ssh -i /run/secrets/nix_build_ssh_key root@10.1.1.3 'pkill -f nixos-rebuild; sleep 2; pgrep -fa nixos-rebuild || echo clean'"
      - name: Verify nothing wedged remains
        run: |
          ssh root@europa \
            "ssh -i /run/secrets/nix_build_ssh_key root@10.1.1.3 'pgrep -fa nixos-rebuild || echo no-rebuild-running'"
