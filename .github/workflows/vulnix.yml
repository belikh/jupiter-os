name: vulnix

# Weekly CVE scan of each host's system derivation with vulnix
# (https://github.com/nix-community/vulnix). Matches derivation name+version
# against NVD, so hits are leads, not conclusions; triage rules are in
# .opencode/skills/nixos-updates/references/cve-triage.md. The scan reads the
# built toplevel's runtime closure (vulnix -C; no build-time tools). No host sets
# jupiter.build.microarch, so the build substitutes from cache.nixos.org.
# Name collisions are suppressed by vulnix.whitelist.toml. Findings go to the
# job summary and do not fail the job; only a build or scan error does.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # amalthea stands in for the kiosks (shared tcxwave-kiosk module).
        host: [europa, callisto, amalthea]
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (node24)
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      # vulnix downloads the NVD feeds with a fixed 10 s read timeout, which
      # nvd.nist.gov exceeds often. Cache the parsed feeds and retry below.
      - name: NVD feed cache
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0 (node24)
        with:
          path: ~/.cache/vulnix
          key: vulnix-nvd-${{ matrix.host }}-${{ github.run_id }}
          restore-keys: |
            vulnix-nvd-
      - name: Scan ${{ matrix.host }}
        run: |
          out=$(nix build --no-link --print-out-paths ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel")
          # vulnix exits 2 when it finds vulnerabilities; any other non-zero is an error.
          rc=0
          for attempt in 1 2 3 4 5; do
            rc=0
            nix run nixpkgs#vulnix -- -C -w vulnix.whitelist.toml "$out" > vulnix.txt || rc=$?
            [ "$rc" -eq 0 ] || [ "$rc" -eq 2 ] && break
            echo "vulnix attempt $attempt exited $rc; retrying in 30 s" >&2
            sleep 30
          done
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            cat vulnix.txt
            exit "$rc"
          fi
          {
            echo "## vulnix: ${{ matrix.host }}"
            echo
            grep -m1 'derivations with active advisories' vulnix.txt || echo "No active advisories."
            echo
            echo '```'
            cat vulnix.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
