name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting + flake evaluation.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix run nixpkgs#nixfmt-rfc-style -- --check .
      - name: Flake check (evaluates every host)
        run: nix flake check --no-build

  # Build all hosts in a single fleet derivation, pushing to Harmonia on main.
  # Sequential is implicit since it's one derivation - no parallel OOM.
  build-fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Free ~30 GiB before building.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cache Nix store by nixpkgs commit (flake.lock hash)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nix
          key: nix-${{ runner.os }}-nixpkgs-${{ hashFiles('flake.lock') }}-${{ github.run_id }}
          restore-keys: |
            nix-${{ runner.os }}-nixpkgs-${{ hashFiles('flake.lock') }}-
      # Stage the CI cache scripts before nix is installed.
      - name: Stage CI cache scripts
        run: |
          sudo install -d -m 755 /opt/ci
          sudo cp scripts/ci/post-build-hook.sh scripts/ci/cache-drainer.sh scripts/ci/retain-recent.sh /opt/ci/
          sudo chmod 755 /opt/ci/*.sh
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            substituters = https://cache.jupiter.au https://cache.nixos.org
            trusted-public-keys = ${{ secrets.HARMONIA_PUBLIC_KEY }} cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            connect-timeout = 5
            post-build-hook = ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/opt/ci/post-build-hook.sh' || '' }}
            system-features = gccarch-btver2 gccarch-skylake
            cores = 4
            max-jobs = 1
            distributed-builds = true
            # Build machines configured via builders file below
      # Setup remote builders SSH key and known hosts
      - name: Setup remote builders SSH
        if: github.ref == 'refs/heads/main'
        run: |
          sudo install -d -m 700 /run/secrets
          printf '%s\n' "${{ secrets.NIX_BUILD_SSH_KEY }}" | sudo tee /run/secrets/nix_build_ssh_key >/dev/null
          sudo chmod 600 /run/secrets/nix_build_ssh_key
          # Known hosts for build machines (from build-machines.nix)
          {
            echo "10.1.1.3 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIINKUMgEPCzZRq74JtvkMmfmT6gOmZWGGq8G9lNqqKsU"
            echo "amalthea.localdomain ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGQV+BzJbBfN+T3WKEUo4CzwJHS1B2bsnH5vglHmbP+Y"
            echo "thebe.localdomain ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOjnMhsh8PxlRW1tXYR4GjjDNa4J8os/4URkbD777JMg"
            echo "metis.localdomain ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAB6bFJpQteERsDDg7otkc42JOWXDZUA9WprQ/gnEiAK"
          } | sudo tee /etc/ssh/ssh_known_hosts >/dev/null
          # Also copy to root's known_hosts for nix-daemon
          sudo mkdir -p /root/.ssh
          sudo cp /etc/ssh/ssh_known_hosts /root/.ssh/known_hosts
          sudo chmod 644 /root/.ssh/known_hosts
          # Create builders file for distributed builds
          cat << 'EOF' | sudo tee /etc/nix/builders >/dev/null
            10.1.1.3 ssh-ng /run/secrets/nix_build_ssh_key 1 2 gccarch-btver2,gccarch-skylake,big-parallel
            amalthea.localdomain ssh-ng /run/secrets/nix_build_ssh_key 1 1 gccarch-skylake,gccarch-btver2,big-parallel
            metis.localdomain ssh-ng /run/secrets/nix_build_ssh_key 1 1 gccarch-skylake,gccarch-btver2,big-parallel
            thebe.localdomain ssh-ng /run/secrets/nix_build_ssh_key 1 1 gccarch-skylake,gccarch-btver2,big-parallel
          EOF
          sudo chmod 644 /etc/nix/builders
          # Ensure nix.conf includes builders
          echo 'builders = /etc/nix/builders' | sudo tee -a /etc/nix/nix.conf >/dev/null
      # ---- main-only: WireGuard + cache drainer + build ----
      - name: WireGuard up + build fleet + drainer (main only)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          EUROPA_SSH: europa-ci
          BUILD_SHA: ${{ github.sha }}
        run: |
          # WireGuard setup
          sudo apt-get update && sudo apt-get install -y wireguard-tools
          sudo install -d -m 700 /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf >/dev/null <<EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_RUNNER_PRIVATE_KEY }}
          Address    = ${{ secrets.WG_RUNNER_ADDRESS }}
          MTU        = 1280

          [Peer]
          PublicKey           = ${{ secrets.WG_UDM_PUBLIC_KEY }}
          Endpoint            = ${{ secrets.WG_UDM_ENDPOINT }}
          AllowedIPs          = 10.1.1.0/24
          PersistentKeepalive = 25
          EOF
          sudo wg-quick up wg0
          sudo wg show
          install -m 700 -d "$HOME/.ssh"
          mkdir -p "$HOME/.ssh/controlmasters"
          {
            echo "Host europa-ci"
            echo "  HostName 10.1.1.2"
            echo "  User jupiter-ci"
            echo "  IdentityFile $HOME/.ssh/europa_ci"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ControlMaster auto"
            echo "  ControlPath $HOME/.ssh/controlmasters/%r@%h:%p"
            echo "  ControlPersist 30m"
            echo ""
            echo "Host callisto"
            echo "  HostName 10.1.1.3"
            echo "  User root"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ControlMaster auto"
            echo "  ControlPath $HOME/.ssh/controlmasters/%r@%h:%p"
            echo "  ControlPersist 30m"
            echo ""
            echo "Host thebe"
            echo "  HostName thebe"
            echo "  User root"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ControlMaster auto"
            echo "  ControlPath $HOME/.ssh/controlmasters/%r@%h:%p"
            echo "  ControlPersist 30m"
            echo ""
            echo "Host amalthea"
            echo "  HostName amalthea"
            echo "  User root"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ControlMaster auto"
            echo "  ControlPath $HOME/.ssh/controlmasters/%r@%h:%p"
            echo "  ControlPersist 30m"
            echo ""
            echo "Host metis"
            echo "  HostName metis"
            echo "  User root"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ControlMaster auto"
            echo "  ControlPath $HOME/.ssh/controlmasters/%r@%h:%p"
            echo "  ControlPersist 30m"
          } >> "$HOME/.ssh/config"
          printf '%s\n' "${{ secrets.EUROPA_CI_SSH_KEY }}" > "$HOME/.ssh/europa_ci"
          chmod 600 "$HOME/.ssh/europa_ci"
          # Establish persistent SSH ControlMaster connection for fast nix copy in post-build-hook
          ssh -o ConnectTimeout=15 -o ControlMaster=auto -o ControlPath="$HOME/.ssh/controlmasters/%r@%h:%p" -o ControlPersist=30m europa-ci true
          # Also set up for root (post-build-hook runs as nix-daemon user = root)
          sudo mkdir -p /root/.ssh/controlmasters
          sudo cp "$HOME/.ssh/config" /root/.ssh/config
          sudo cp "$HOME/.ssh/europa_ci" /root/.ssh/europa_ci
          sudo chmod 600 /root/.ssh/europa_ci
          sudo chmod 600 /root/.ssh/config
          sudo ssh -o ConnectTimeout=15 -o ControlMaster=auto -o ControlPath="/root/.ssh/controlmasters/%r@%h:%p" -o ControlPersist=30m europa-ci true
          curl -fsS --max-time 15 http://10.1.1.2:5000/nix-cache-info \
            || { echo "::error::Harmonia unreachable over WG"; sudo wg show; exit 1; }
          ssh -o ConnectTimeout=15 europa-ci true

          # Start SSH daemon for debugging (accessible via WireGuard IP on normal port)
          echo "${{ secrets.GHA_DEBUG_SSH_KEY }}" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -D -o Port=22 -o PasswordAuthentication=no -o PermitRootLogin=no -o AuthorizedKeysFile="$HOME/.ssh/authorized_keys" &
          SSHD_PID=$!
          echo "SSH daemon started on port 22 (PID: $SSHD_PID)"
          echo "Connect via: ssh runner@$(ip -4 addr show wg0 | grep -oP 'inet \K[\d.]+')"

          # Start drainer in background, tee output to console + file (real-time visibility)
          /opt/ci/cache-drainer.sh 2>&1 | tee /tmp/ci-drainer.log &
          DRAINER_PID=$!
          echo "Started cache drainer (PID: $DRAINER_PID)"

          # Build each host individually (this will enqueue paths for the drainer)
          for host in europa callisto pallene amalthea metis adrastea thebe; do
            echo "Building $host..."
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" || exit 1
            
            # Force push this host's closure to europa immediately
            echo "Pushing $host closure to europa..."
            TOPO=$(nix path-info ".#nixosConfigurations.$host.config.system.build.toplevel")
            nix copy --to "ssh-ng://europa-ci" "$TOPO" || echo "WARNING: push failed for $host"
          done
          BUILD_EXIT=0

          # Push full build closure (including bootstrap tools, build deps)
          echo "Pushing full build closure to europa..."
          nix path-info -r $(nix path-info ".#nixosConfigurations.*" | grep toplevel) | nix copy --to "ssh-ng://europa-ci" --stdin || echo "WARNING: full closure push failed"

          # Pin + retain last 3 builds
          for host in europa callisto pallene amalthea metis adrastea thebe; do
            BUILD_HOST=$host /opt/ci/retain-recent.sh
          done

          # Wait a bit for drainer to finish processing queue
          sleep 10

          # Stop drainer
          kill $DRAINER_PID 2>/dev/null || true
          pkill -f cache-drainer.sh 2>/dev/null || true

          # Stop SSH daemon
          kill $SSHD_PID 2>/dev/null || true

          # Teardown WireGuard
          sudo wg-quick down wg0 || true

          exit $BUILD_EXIT