name: CI

on:
  # Fast checks only: formatting, flake evaluation, the arcade-webapp Go
  # tests and the two NixOS VM lanes. The per-host build-and-push-to-Harmonia
  # job was removed 2026-11-11; the coordinated builds live in the
  # workflow_dispatch-only ci-distributed*.yml workflows.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting + flake evaluation.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (node24)
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check formatting
        run: nix run nixpkgs#nixfmt -- --check .
      - name: Flake check (evaluates every host)
        run: nix flake check --no-build
      # Arcade remediation SPEC.md constitution rule 3: deferrals and
      # decommission triggers are DATED ledger rows with CI reminders,
      # never prose. Fails when a row's trigger date arrives with the row
      # still open (or the ledger is malformed).
      - name: Remediation ledger gate
        run: ./scripts/ledger-check.sh docs/plans/arcade-remediation-ledger.tsv

  # L1 lane (arcade remediation SPEC.md §3 / plan §6.E): go vet + race-
  # enabled tests + the igir fixture gate on pkgs/arcade-webapp. KVM-less;
  # this is the lane that catches unit-level defects on EVERY PR — the
  # gap that let a webapp-breaking PR merge green (format/eval-only
  # gating). Blocking and identical for agent and human commits.
  arcade-webapp-l1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (node24)
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Go build/test caches
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0 (node24)
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: arcade-webapp-l1-${{ runner.os }}-${{ hashFiles('pkgs/arcade-webapp/go.sum') }}
          restore-keys: |
            arcade-webapp-l1-${{ runner.os }}-
      # Same commands as `make check-arcade-webapp` (devShell Go pinned by
      # flake.lock) so local, CI, human and agent runs are identical.
      - name: go vet
        run: nix develop -c bash -c 'cd pkgs/arcade-webapp && go vet ./...'
      - name: go test -race
        run: nix develop -c bash -c 'cd pkgs/arcade-webapp && go test -race ./...'
      - name: igir fixture gate (zero unmatched)
        run: nix develop -c bash -c 'make fixture-arcade'

  # L2 lane (arcade remediation SPEC.md §3 / plan §6.E): the 1517-line VM
  # harness (tests/hosts/arcade-webapp-vm.nix — the REAL production module,
  # REAL igir, deterministic fixture corpus) converted to a
  # testers.runNixOSTest flake check. Building the check BOOTS the VM and
  # runs the in-VM smoke; -L streams the VM serial console into this job's
  # log so failures are legible. Runs on every PR.
  arcade-webapp-l2-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (node24)
      # KVM udev unlock, moved here from build-host (arcade remediation
      # W0): this is the job that actually boots VMs — hosted KVM for
      # public repos is generosity, not contract, hence the fail-loud
      # probe below rather than a silent TCG fallback.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Mandatory binding condition (plan §6.E): TCG fallback is a 10-12x
      # slowdown that misdiagnoses as flaky timeouts — the exact failure
      # class that gets a new gate disabled in week two. Fail loud instead.
      - name: Fail-loud /dev/kvm probe (refuse silent TCG fallback)
        run: |
          if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm unavailable after the udev unlock — refusing TCG fallback. The named contingency lane (nspawn/container tier, SPEC.md §3) is the documented degraded path; do not re-run hoping it passes."
            ls -l /dev/kvm || true
            exit 1
          fi
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = kvm nixos-test big-parallel
      - name: Run arcade-webapp-vm NixOS test
        run: nix build -L --no-link .#checks.x86_64-linux.arcade-webapp-vm

  # L3 lane (arcade remediation SPEC.md §3 / plan §6.E): chromium-in-VM
  # Playwright driving the real dashboard served by the real module in
  # the L2 harness — the only lane whose client sends exactly what a
  # real browser sends (htmx's native HX-Request header). Fails on any
  # 4xx on any resource and any duplicate panel id; the only gate that
  # could have caught the lifetime silent 403 on browser-originated
  # mutations. Playwright and the chromium binary both come from the
  # pinned nixpkgs' in-tree packaging — no CDN downloads. Blocking and
  # identical for agent and human commits.
  arcade-webapp-l3-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (node24)
      # Same KVM udev unlock + mandatory fail-loud probe as the L2 job
      # (plan §6.E binding condition): TCG fallback is a 10-12x slowdown
      # that misdiagnoses as flaky timeouts. Refuse it.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Fail-loud /dev/kvm probe (refuse silent TCG fallback)
        run: |
          if [ ! -c /dev/kvm ] || [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm unavailable after the udev unlock — refusing TCG fallback. The named contingency lane (nspawn/container tier, SPEC.md §3) is the documented degraded path; do not re-run hoping it passes."
            ls -l /dev/kvm || true
            exit 1
          fi
          ls -l /dev/kvm
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            system-features = kvm nixos-test big-parallel
      - name: Run arcade-webapp-browser-vm NixOS test
        run: nix build -L --no-link .#checks.x86_64-linux.arcade-webapp-browser-vm
