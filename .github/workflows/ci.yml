name: CI

on:
  # Re-enabled 2026-08-17 (audit): the runbook (docs/ci-harmonia-push-runbook.md)
  # designs CI as push-on-main + PR build/smoke without push; the commented-out
  # triggers were a debugging leftover whose comment even pointed at a
  # nonexistent "ci-europa.yml" (the distributed pipeline is
  # ci-distributed-europa.yml, and it stays workflow_dispatch-only — the heavy
  # coordinated build is run on demand).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting + flake evaluation.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (node24)
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Check formatting
        run: nix run nixpkgs#nixfmt -- --check .
      - name: Flake check (evaluates every host)
        run: nix flake check --no-build

  # Build each host in parallel on separate runners, pushing to Harmonia on main.
  build-host:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host-group: "tuned"
            hosts: "europa"
          - host-group: "tuned"
            hosts: "callisto"
          - host-group: "kiosks"
            hosts: "amalthea metis adrastea thebe"
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0 (node24)
      # Free ~30 GiB before building.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Cache Nix evaluation/download cache by nixpkgs commit (flake.lock hash)
      - uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0 (node24)
        with:
          path: ~/.cache/nix
          key: nix-${{ runner.os }}-nixpkgs-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-${{ runner.os }}-nixpkgs-${{ hashFiles('flake.lock') }}-
      # Stage the CI cache scripts before nix is installed.
      - name: Stage CI cache scripts
        run: |
          sudo install -d -m 755 /opt/ci
          sudo cp scripts/ci/post-build-hook.sh scripts/ci/cache-drainer.sh scripts/ci/retain-recent.sh /opt/ci/
          sudo chmod 755 /opt/ci/*.sh
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            substituters = https://cache.jupiter.au https://cache.nixos.org
            trusted-public-keys = ${{ secrets.HARMONIA_PUBLIC_KEY }} cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            connect-timeout = 60
            # Auto-GC before the run drowns the disk: full-fleet closures plus
            # their substitutions overflow a ~60GB runner partway through.
            # Active derivations are GC-rooted, so this only prunes paths we
            # can re-substitute later if needed.
            min-free = 10G
            max-free = 25G
            # Never-disable policy: nix disables a binary cache for 60s per failed
            # download and that window is hardcoded upstream — the only lever is
            # making failures rare. stalled-download-timeout governs zero-data
            # gaps mid-transfer (DERP relays trickle); default 300s aborts
            # transfers that would otherwise complete.
            stalled-download-timeout = 900
            post-build-hook = /opt/ci/post-build-hook.sh
            system-features = gccarch-bdver4 gccarch-skylake big-parallel
            extra-platforms = i686-linux x86_64-linux
            cores = 1
            max-jobs = 4
            builders-use-substitutes = true
            # No remote builders configured — see the removed "Setup remote
            # builders SSH" step's history for why. It pinned callisto/kiosks
            # by raw LAN IP (10.1.1.x) reachable only over a WireGuard
            # road-warrior tunnel that no longer exists in this workflow
            # (fully replaced by Tailscale/headscale) — every connection
            # attempt wasted up to ConnectTimeout=10s per host for zero
            # benefit, since CI already builds everything locally fine.
            # Once callisto/kiosks are deployed and registered on the
            # tailnet, this can come back targeting their tailscale
            # addresses instead of the now-unreachable LAN IPs.

      - name: Enable i686 binfmt emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-i386 || true

      # ---- Tailscale + cache drainer + build ----
      - name: Tailscale up + build + drainer
        env:
          EUROPA_SSH: europa-ci
          BUILD_SHA: ${{ github.sha }}
          HOST_GROUP: ${{ matrix.host-group }}
          HOSTS: ${{ matrix.hosts }}
        run: |
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sudo sh
          
          # Start Tailscale with auth key (pre-auth key for CI tag)
          # Uses reusable ephemeral key from Headscale (configured in headscale.nix)
          # Ephemeral is configured on the pre-auth key in headscale, not via CLI flag.
          # Do NOT also pass --advertise-tags here: headscale 0.29.3 hard-rejects
          # registration outright if a PreAuthKey that already carries tags (this
          # one was created with --tags tag:ci) is combined with ANY client-side
          # --advertise-tags request — confirmed in hscontrol/state/state.go
          # ("Reject advertise-tags for PreAuthKey registrations early... PreAuthKey
          # nodes get their tags from the key itself, not from client requests").
          # Not a redundant no-op as it might appear — a hard registration failure
          # ("requested tags [tag:ci] are invalid or not permitted").
          #
          # NOTE: the public https://headscale.jupiter.au (fronted by
          # Cloudflare Tunnel) CANNOT carry the TS2021 noise protocol at
          # all — cloudflared only supports GET-based WebSocket upgrades,
          # and Tailscale/Headscale upgrades over POST, which cloudflared
          # explicitly does not support (not a bug — confirmed by
          # Cloudflare staff: github.com/cloudflare/cloudflared#883). Every
          # request through the tunnel hits headscale's NoiseUpgradeHandler
          # with the Upgrade header stripped ("no upgrade header in TS2021
          # request"), no matter the ingress config.
          #
          # login-server instead hits the UDM's WAN IPv4 on a dedicated
          # port-forward (neptune.jupiter.au:8080 -> europa:8080), added
          # specifically because GitHub-hosted runners have no outbound
          # IPv6 (github.com/actions/runner#402) — ruled out an IPv6-only
          # port-forward (europa's other exposed ports, e.g. DERP/STUN, are
          # IPv6-only) as unusable from CI. https, not http: DERP relay
          # connections require REAL TLS regardless of scheme (confirmed
          # live: "tls: first record does not look like a TLS handshake"
          # against a plain-HTTP listener) — headscale now terminates its
          # own TLS via Let's Encrypt on this same host:port.
          sudo tailscale up \
            --login-server=https://neptune.jupiter.au:8080 \
            --authkey=${{ secrets.TAILSCALE_CI_AUTHKEY }} \
            --accept-routes
          
          # Verify Harmonia reachability via its existing public Cloudflare
          # Tunnel endpoint, not the tailnet — cache.jupiter.au is a plain
          # HTTPS GET path (no protocol upgrade involved), so it's unaffected
          # by the TS2021/DERP POST-upgrade limitation Cloudflare Tunnel has.
          curl -fsS --max-time 60 https://cache.jupiter.au/nix-cache-info \
            || { echo "::error::Harmonia unreachable via cache.jupiter.au"; exit 1; }
          
          # SSH config for europa-ci (jupiter-ci user on europa via tailnet)
          install -m 700 -d "$HOME/.ssh"
          mkdir -p "$HOME/.ssh/controlmasters"
          {
            echo "Host europa-ci"
            echo "  HostName europa"
            echo "  User jupiter-ci"
            echo "  IdentityFile $HOME/.ssh/europa_ci"
            echo "  StrictHostKeyChecking accept-new"
            echo "  ControlMaster auto"
            echo "  ControlPath $HOME/.ssh/controlmasters/%r@%h:%p"
            echo "  ControlPersist 30m"
          } >> "$HOME/.ssh/config"
          printf '%s\n' "${{ secrets.EUROPA_CI_SSH_KEY }}" > "$HOME/.ssh/europa_ci"
          chmod 600 "$HOME/.ssh/europa_ci"
          
          # Establish persistent SSH ControlMaster connection for fast nix copy in post-build-hook
          ssh -o ConnectTimeout=15 -o ControlMaster=auto -o ControlPath="$HOME/.ssh/controlmasters/%r@%h:%p" -o ControlPersist=30m europa-ci true
          
          # Also set up for root (post-build-hook runs as nix-daemon user = root)
          sudo mkdir -p /root/.ssh/controlmasters
          sudo cp "$HOME/.ssh/config" /root/.ssh/config
          sudo cp "$HOME/.ssh/europa_ci" /root/.ssh/europa_ci
          sudo chmod 600 /root/.ssh/europa_ci
          sudo chmod 600 /root/.ssh/config
          sudo ssh -o ConnectTimeout=15 -o ControlMaster=auto -o ControlPath="/root/.ssh/controlmasters/%r@%h:%p" -o ControlPersist=30m europa-ci true

          # Start SSH daemon for debugging (accessible via tailnet IP on normal port)
          echo "${{ secrets.GHA_DEBUG_SSH_KEY }}" >> "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -D -o Port=22 -o PasswordAuthentication=no -o PermitRootLogin=no -o AuthorizedKeysFile="$HOME/.ssh/authorized_keys" &
          SSHD_PID=$!
          echo "SSH daemon started on port 22 (PID: $SSHD_PID)"
          echo "Connect via: ssh runner@$(tailscale ip -4)"

          # Start drainer in background as root (uses root's SSH ControlMaster sockets).
          # `sudo` resets PATH to its own secure_path by default, which does
          # NOT include wherever install-nix-action put the nix binary —
          # confirmed live via the drainer's own diagnostic logging:
          # "env: 'nix': No such file or directory", every single attempt.
          # Resolve nix's absolute path in THIS (unprivileged, correct-PATH)
          # context and pass it through explicitly rather than depend on
          # sudo's PATH policy at all.
          sudo NIX_BIN="$(command -v nix)" /opt/ci/cache-drainer.sh 2>&1 | sudo tee /tmp/ci-drainer.log &
          DRAINER_PID=$!
          echo "Started cache drainer as root (PID: $DRAINER_PID)"

          # Build each host in this group
          BUILD_EXIT=0
          for host in $HOSTS; do
            echo "Building $host..."
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" || { BUILD_EXIT=1; break; }
            
            # Force push this host's closure to europa immediately
            echo "Pushing $host closure to europa..."
            TOPO=$(nix path-info ".#nixosConfigurations.$host.config.system.build.toplevel")
            nix copy --to "ssh-ng://europa-ci" "$TOPO" || echo "WARNING: push failed for $host"
            
            # Pin + retain last 3 builds for this host
            BUILD_HOST=$host /opt/ci/retain-recent.sh
          done

          # Wait a bit for drainer to finish processing queue
          sleep 10

          # Stop drainer
          kill $DRAINER_PID 2>/dev/null || true
          pkill -f cache-drainer.sh 2>/dev/null || true

          # Stop SSH daemon
          kill $SSHD_PID 2>/dev/null || true

          # Teardown Tailscale
          sudo tailscale down || true

          exit $BUILD_EXIT