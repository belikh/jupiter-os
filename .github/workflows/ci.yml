name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: formatting + flake evaluation.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Check formatting
        run: nix run nixpkgs#nixfmt-rfc-style -- --check .
      - name: Flake check (evaluates every host)
        run: nix flake check --no-build

  # Build each host's system closure sequentially, then boot test the kiosks.
  # On pushes to main, also push closures to europa via WG + Harmonia.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Free ~30 GiB before building. Each host realises a full kiosk
      # closure (desktop + Jovian gaming stack + retroarch cores) and then
      # lays down a ~15 GiB QEMU disk image that embeds a copy of that
      # store, which together overflow ubuntu-latest's ~14-22 GiB free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
          tool-cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Stage the CI cache scripts before nix is installed.
      - name: Stage CI cache scripts
        run: |
          sudo install -d -m 755 /opt/ci
          sudo cp scripts/ci/post-build-hook.sh scripts/ci/cache-drainer.sh scripts/ci/retain-recent.sh /opt/ci/
          sudo chmod 755 /opt/ci/*.sh
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            substituters = ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'http://10.1.1.2:5000' || 'https://cache.jupiter.au' }} https://cache.nixos.org
            trusted-public-keys = ${{ secrets.HARMONIA_PUBLIC_KEY }} cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            connect-timeout = 5
            post-build-hook = ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/opt/ci/post-build-hook.sh' || '' }}
            system-features = gccarch-btver2 gccarch-skylake
      # ---- main-only: WireGuard + cache drainer ----
      - name: WireGuard up + ssh config (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y wireguard-tools
          sudo install -d -m 700 /etc/wireguard
          sudo tee /etc/wireguard/wg0.conf >/dev/null <<EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_RUNNER_PRIVATE_KEY }}
          Address    = ${{ secrets.WG_RUNNER_ADDRESS }}
          MTU        = 1280

          [Peer]
          PublicKey           = ${{ secrets.WG_UDM_PUBLIC_KEY }}
          Endpoint            = ${{ secrets.WG_UDM_ENDPOINT }}
          AllowedIPs          = 10.1.1.2/32
          PersistentKeepalive = 25
          EOF
          sudo wg-quick up wg0
          sudo wg show
          install -m 700 -d "$HOME/.ssh"
          {
            echo "Host europa-ci"
            echo "  HostName 10.1.1.2"
            echo "  User jupiter-ci"
            echo "  IdentityFile $HOME/.ssh/europa_ci"
            echo "  StrictHostKeyChecking accept-new"
          } >> "$HOME/.ssh/config"
          printf '%s\n' "${{ secrets.EUROPA_CI_SSH_KEY }}" > "$HOME/.ssh/europa_ci"
          chmod 600 "$HOME/.ssh/europa_ci"
          curl -fsS --max-time 15 http://10.1.1.2:5000/nix-cache-info \
            || { echo "::error::Harmonia unreachable over WG"; sudo wg show; exit 1; }
          ssh -o ConnectTimeout=15 europa-ci true
      - name: Start cache drainer (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EUROPA_SSH: europa-ci
        run: nohup /opt/ci/cache-drainer.sh >/tmp/ci-drainer.log 2>&1 &
      # ---- Build each host sequentially ----
      - name: Build all hosts (closure only)
        run: |
          for host in europa callisto pallene amalthea metis adrastea thebe; do
            echo "=== Building $host ==="
            nix build .#nixosConfigurations.$host.config.system.build.toplevel
          done
      # ---- main-only: pin all builds ----
      - name: Pin + retain last 3 builds (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          for host in europa callisto pallene amalthea metis adrastea thebe; do
            BUILD_HOST=$host /opt/ci/retain-recent.sh
          done
      # ---- Boot smoke test kiosks only ----
      - name: Boot smoke test kiosks
        run: |
          for host in amalthea metis adrastea thebe; do
            echo "=== Boot testing $host ==="
            ./scripts/boot-smoke.sh $host 360
          done
      - name: Teardown tunnel + drainer
        if: always()
        run: |
          pkill -f cache-drainer.sh || true
          sudo wg-quick down wg0 || true